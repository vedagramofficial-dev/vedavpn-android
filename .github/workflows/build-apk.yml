
    - name: Build debug APK
      run: |
        chmod +x ./gradlew
        ./gradlew --no-daemon --stacktrace assembleDebug
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: vedavpn-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 14
